<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b6e55">
<title>Actividades del Día</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: hoja de turno en una columna. Fecha, tira semanal L–S, resumen con "siguiente paso", selector Lista / Por hora, y tarjetas de actividad plegables con lápiz para editar. Un solo acento sobre neutros fríos. */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --surface-2: #f3f6f8;
  --ink: #18222d;
  --ink-2: #566472;
  --line: #d2d9e0;
  --accent: #1b6e55;
  --accent-soft: #dcefe8;
  --accent-ink: #ffffff;
  --danger: #a8341c;
  --t1: #2b6cb0; --t2: #c2570c; --t3: #b8325a; --t4: #6b46c1; --t5: #9a7400;
  --f-display: "Archivo Narrow", "Arial Narrow", Arial, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #1a232c; --surface-2: #212c37; --ink: #e6ecf2; --ink-2: #9fb0c0; --line: #2e3b48;
    --accent: #4fc79b; --accent-soft: #1b3a30; --accent-ink: #08261c; --danger: #f08a63; --t1: #7ab2ee; --t2: #f0a05a; --t3: #f08fb0; --t4: #b69af0; --t5: #e3bf45;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #1a232c; --surface-2: #212c37; --ink: #e6ecf2; --ink-2: #9fb0c0; --line: #2e3b48;
  --accent: #4fc79b; --accent-soft: #1b3a30; --accent-ink: #08261c; --danger: #f08a63; --t1: #7ab2ee; --t2: #f0a05a; --t3: #f08fb0; --t4: #b69af0; --t5: #e3bf45;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body);
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; flex: none; }

.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.eyebrow { font: 600 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 6px; }
h1 { font: 700 clamp(30px, 7vw, 46px)/1 var(--f-display); margin: 0; text-wrap: balance; }
.sub { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
.nav { display: flex; gap: 6px; }
.btn { padding: 8px 14px; min-height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.icon { padding: 8px 12px; min-width: 40px; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 13px; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; min-width: 0; }
.day:hover { background: var(--surface-2); }
.day .dn { font: 600 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.day .dd { font: 600 18px var(--f-mono); }
.day .bar { width: 68%; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.day .bar i { display: block; height: 100%; background: var(--accent); }
.day.today .dn::after { content: " ●"; font-size: 8px; vertical-align: 2px; }
.day[aria-current="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.day[aria-current="true"] .dn { color: inherit; opacity: .75; }
.day[aria-current="true"] .bar { background: color-mix(in srgb, var(--surface) 30%, transparent); }
.day[aria-current="true"] .bar i { background: var(--surface); }

.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 240px); gap: 16px; align-items: center; }
.sum-time { font: 600 26px/1.1 var(--f-mono); letter-spacing: -.02em; }
.sum-sub { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
.sum-next { margin-top: 8px; font-size: 13px; font-weight: 500; color: var(--accent); overflow-wrap: anywhere; }
.prog-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.prog-label b { color: var(--ink); font-family: var(--f-mono); font-weight: 600; }
.prog { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); transition: width .25s; }

.viewbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 8px 16px; min-height: 38px; cursor: pointer; font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

.list { display: flex; flex-direction: column; gap: 16px; }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.bhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px 6px 4px; }
.bt { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; text-align: left; background: transparent; border: 0; cursor: pointer; padding: 8px 8px; border-radius: 6px; }
.bt:hover { background: var(--surface-2); }
.chev { transition: transform .15s; color: var(--ink-2); }
[aria-expanded="false"] > .chev { transform: rotate(-90deg); }
.bmain { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.bname { font: 700 22px/1.1 var(--f-display); overflow-wrap: anywhere; }
.range { font: 500 12px var(--f-mono); color: var(--ink-2); }
.bright { display: flex; align-items: center; gap: 10px; }
.bcount { font: 600 13px var(--f-mono); color: var(--ink-2); white-space: nowrap; }
.pen { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; color: var(--ink-2); flex: none; }
.pen:hover { background: var(--surface-2); color: var(--ink); }
.steps { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.step { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); padding-right: 10px; }
.step:last-child { border-bottom: 0; }
.step label { flex: 1; min-width: 0; display: grid; grid-template-columns: auto 3.2rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 6px 11px 16px; cursor: pointer; }
.step input[type="checkbox"] { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
.t { font: 500 14px var(--f-mono); color: var(--ink-2); }
.n { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.n small { display: block; font: 400 12px var(--f-mono); color: var(--ink-2); margin-top: 1px; }
.m { font: 500 13px var(--f-mono); color: var(--ink-2); white-space: nowrap; }
.step.done .nm { text-decoration: line-through; opacity: .55; }
.step.now { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
.endrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 16px; background: var(--surface-2); border-top: 1px solid var(--line); font-weight: 600; font-size: 14px; }
.endrow b { font: 600 16px var(--f-mono); color: var(--accent); }
.endrow small { font: 500 12px var(--f-mono); color: var(--ink-2); margin-left: 8px; }

.hours { display: flex; flex-direction: column; max-width: 820px; }
.list.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: start; gap: 16px; }
.cols > .editing, .cols > .emptycard { grid-column: 1 / -1; }
.hour { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr); gap: 12px; }
.hlabel { font: 600 15px var(--f-mono); color: var(--ink-2); padding-top: 13px; text-align: right; }
.hcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 8px; min-width: 0; }
.hcard.empty { background: transparent; border-style: dashed; padding: 10px 14px; color: var(--ink-2); font-size: 13px; }
.hhead { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; background: transparent; border: 0; cursor: pointer; padding: 11px 14px 11px 10px; }
.hhead:hover { background: var(--surface-2); }
.hmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.hmain b { font-weight: 600; font-size: 14px; }
.hmain span { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hmain .nowtag { color: var(--accent); font-weight: 600; font-family: var(--f-mono); }
.hcard .steps { border-top: 1px solid var(--line); }

.edit-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.edit-title { font: 700 20px/1.1 var(--f-display); margin: 0; }
.in { font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--ink); min-width: 0; width: 100%; min-height: 40px; }
textarea.in { resize: vertical; min-height: 84px; }
.fl { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fl > span { font: 600 12px var(--f-body); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.fgrid { display: grid; grid-template-columns: minmax(0, 1fr) 9rem; gap: 10px; }
.fgrid.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.days { display: flex; gap: 6px; flex-wrap: wrap; align-items: end; }
.dchip { min-width: 44px; min-height: 40px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; font-weight: 600; font-size: 13px; }
.dchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.elist { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; list-style: none; }
.estep { display: grid; grid-template-columns: minmax(0, 1fr) 80px 40px; gap: 8px; }
.hint { color: var(--ink-2); font-size: 12px; margin: 0; }
.err { color: var(--danger); font-size: 13px; font-weight: 500; margin: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
.actions .left { display: flex; gap: 8px; flex-wrap: wrap; }

.emptycard { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 18px 16px; }
.emptycard b { font: 700 20px var(--f-display); display: block; }
.emptycard p { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }

.guestbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; padding: 12px 14px; }
.guestbar b { font-size: 14px; }
.guestbar p { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); max-width: 52ch; }
.gb-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.samples { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-top: 10px; }
.sample { text-align: left; padding: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.sample:hover { background: var(--surface-2); }
.emptycard .sample b { font: 700 17px var(--f-display); }
.sample span { font-size: 12px; color: var(--ink-2); }
.mhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.mtitle { font: 700 26px/1 var(--f-display); margin: 0; }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.mdow { font: 600 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); text-align: center; padding: 2px 0 4px; }
.mcell { position: relative; min-height: 96px; display: flex; flex-direction: column; align-items: stretch; gap: 3px; padding: 6px 6px 9px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; text-align: left; overflow: hidden; min-width: 0; }
.mcell:hover { background: var(--surface-2); }
.mcell.out { opacity: .5; }
.mcell.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.mnum { font: 600 13px var(--f-mono); align-self: flex-start; min-width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; padding: 0 4px; }
.mcell.today .mnum { background: var(--accent); color: var(--accent-ink); }
.mchip { display: block; font-size: 11px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: color-mix(in srgb, var(--lc, var(--ink-2)) 14%, var(--surface)); border-left: 3px solid var(--lc, var(--line)); border-radius: 4px; padding: 2px 4px; }
.mchip i { font: 500 10px var(--f-mono); font-style: normal; color: var(--ink-2); margin-right: 4px; }
.mmore { font-size: 11px; color: var(--ink-2); }
.mdots { display: none; }
.mdots i { width: 7px; height: 7px; border-radius: 50%; background: var(--lc); display: block; }
.mbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; }
.mbar i { display: block; height: 100%; background: var(--accent); }
.mday { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
.mdayhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.mdayhead h3 { font: 700 22px/1.1 var(--f-display); margin: 0; }
@media (max-width: 600px) {
  .mchip, .mmore { display: none; }
  .mdots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
  .msel { font-size: 18px; }
  .mcell { min-height: 58px; align-items: center; padding: 4px 2px 8px; }
  .mnum { align-self: center; }
}
.topbar { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-block: 8px; display: flex; flex-direction: column; gap: 8px; }
.labelbar { display: flex; gap: 6px; flex-wrap: wrap; }
.lchip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; cursor: pointer; font-size: 13px; font-weight: 500; }
.lchip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.ldot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--lc, var(--ink-2)); flex: none; vertical-align: 0; }
.block[data-lab] { border-left: 4px solid var(--lc); }
.dchip { display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.lrows { display: flex; flex-direction: column; gap: 8px; max-width: 420px; }
.lrow { display: flex; align-items: center; gap: 10px; }
.lrow .ldot { width: 14px; height: 14px; }
.mcenter { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.msel { font: 700 22px var(--f-display); padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); min-height: 40px; cursor: pointer; }
.note { display: flex; flex-direction: column; gap: 6px; }
.note label { font: 600 12px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tools .left { display: flex; gap: 8px; flex-wrap: wrap; }
.sync { font-size: 12px; color: var(--ink-2); }
.tools .sync { overflow-wrap: anywhere; }
.tools > .sync { flex-basis: 100%; }
.acct { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

@media (max-width: 560px) {
  .summary { grid-template-columns: minmax(0, 1fr); }
  .fgrid, .fgrid.two { grid-template-columns: minmax(0, 1fr); }
  .step label { grid-template-columns: auto 2.9rem minmax(0, 1fr) auto; gap: 8px; padding-left: 12px; }
  .hour { grid-template-columns: 2.9rem minmax(0, 1fr); gap: 8px; }
  .bname { font-size: 20px; }
  .week { gap: 4px; }
  .day { padding-inline: 2px; }
  .day .dd { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <p class="eyebrow">Actividades diarias</p>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="nav">
      <button class="btn icon" data-act="prev" aria-label="Día anterior">←</button>
      <button class="btn" data-act="today">Hoy</button>
      <button class="btn icon" data-act="next" aria-label="Día siguiente">→</button>
    </div>
  </header>
  <div class="topbar">
    <div class="viewbar" id="viewbar"></div>
    <div class="labelbar" id="labelbar" hidden></div>
  </div>
  <nav class="week" id="week" aria-label="Semana"></nav>
  <section class="summary" id="summary"></section>
  <div class="guestbar" id="guestbar" hidden></div>
  <div class="block" id="labelsPanel" hidden></div>
  <div class="list" id="blocks"></div>
  <div class="note">
    <label for="noteBox">Nota del día</label>
    <textarea class="in" id="noteBox" rows="2" placeholder="Algo que no quieres olvidar este día"></textarea>
  </div>
  <footer class="tools" id="tools"></footer>
  <input type="file" id="importBox" accept="application/json,.json" hidden>
</main>

<script>
(function () {
  var DOW = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var DOWS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  var DCHIP = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
  var MON = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var MONS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var LS_KEY = 'labores-del-dia-v1', LS_VIEW = 'labores-del-dia-vista';
  var ICON_PEN = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  var ICON_CHEV = '<svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

  function pad(n) { return String(n).padStart(2, '0'); }
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function toMin(s) { var m = /^(\d{1,2}):(\d{2})/.exec(s || ''); return m ? (+m[1]) * 60 + (+m[2]) : 0; }
  function fmt(m) { m = ((m % 1440) + 1440) % 1440; return Math.floor(m / 60) + ':' + pad(m % 60); }
  function hhmm(m) { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { return 'x' + Math.random().toString(36).slice(2, 8); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function noon(d) { var x = new Date(d); x.setHours(12, 0, 0, 0); return x; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function parseKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  var DEFAULT_LABELS = ['Trabajo', 'Personal', 'Salud', 'Estudio', ''];
  function seed() {
    return { v: 2, updatedAt: 0, done: {}, notes: {}, labelNames: DEFAULT_LABELS.slice(), blocks: [] };
  }

    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { shiftMonth(dx < 0 ? 1 : -1); renderBlocks(); }
  }, { passive: true });

  var lastToday = keyOf(new Date());
  function tick() {
    var nk = keyOf(new Date());
    if (nk !== lastToday) {
      if (keyOf(sel) === lastToday) { sel = noon(new Date()); syncMonth(); }
      lastToday = nk;
      if (!editId && !draft) render();
      return;
    }
    if (!editId && !draft && !document.hidden && keyOf(sel) === nk) { renderBlocks(); renderSummary(); }
  }
  setInterval(tick, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });

  render();
  initSync();
})();
</script>
</body>
</html>
